# CI de MGG (pruebas + build) en cada push a main.
#
# EL DESPLIEGUE NO SALE DE ACÁ (17-10-2026). Este flujo exigía secrets del Droplet
# (DROPLET_HOST, DROPLET_SSH_KEY…) que nunca se cargaron, así que cada push a main
# fallaba en rojo avisando «el deploy NO se hizo» y el servidor seguía con la versión
# vieja hasta que alguien corría `mgg-deploy` a mano (pasó el 16-10-2026 con los
# cambios de un compañero).
#
# Ahora el Droplet se despliega SOLO: un timer de systemd (`mgg-autodeploy.timer`,
# cada 5 minutos) revisa si origin/main tiene un commit nuevo y, si lo hay, corre
# `mgg-deploy` (compila aparte y cambia el puntero sin caída). No necesita secrets
# en GitHub. Para ver el estado en el servidor:
#   systemctl list-timers | grep mgg        tail -n 30 /var/log/mgg-autodeploy.log
#
# Este flujo queda como control de calidad: si las pruebas o el build fallan, el
# push sale en rojo y hay que corregirlo (el servidor igual intentará desplegar lo
# que haya en main; mgg-deploy aborta si el build no compila y deja la versión anterior).

name: CI (pruebas y build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Build (base '/')
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: https://example.supabase.co
        run: npm run build

      - name: Resumen
        run: |
          {
            echo "## Pruebas y build en verde"
            echo ""
            echo "El despliegue lo hace el Droplet solo (timer \`mgg-autodeploy\`, cada 5 min) al ver este commit en main."
          } >> "$GITHUB_STEP_SUMMARY"
